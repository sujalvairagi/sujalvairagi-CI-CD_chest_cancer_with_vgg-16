AUGMENTATION: True
IMAGE_SIZE: [224, 224, 3]
BATCH_SIZE: 16
INCLUDE_TOP: False
EPOCHS: 1
CLASSES: 2
WEIGHTS: imagenet
LEARNING_RATE: 0.01

# Improved Tuning Configurations
WARMUP_EPOCHS: 5 # Give the head enough time to settle
FINE_TUNE_EPOCHS: 30   # Give fine-tuning plenty of time (EarlyStopping will cut it short if needed)
WARMUP_LR: 0.001
FINE_TUNE_LR: 0.00001
FINE_TUNE_LAYERS: 20   # Unfreeze a bit more of the network