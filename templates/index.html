<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Chest Cancer Classification</title>
    <link rel="shortcut icon" href="https://upload.wikimedia.org/wikipedia/commons/thumb/8/83/Circle-icons-hospital.svg/1024px-Circle-icons-hospital.svg.png" />
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    
    <style>
        body{background-color: #eff2f9;}
        .iupload h3{color: #1b2d6b;font-size: 30px;font-weight: 700;}
        .img-part{height:300px;width:300px;margin:0px auto;}
        .image-part{height:300px;width:300px;border:1px solid #1b2d6b;}
        .image-part img{position:absolute;height: 300px;width:300px;display:none;padding:5px;}
        .image-part #video{display:block;height: 300px;width:300px;padding:5px;}
        .res-part{border:1px solid #dedede;margin-left:20px;height: 310px;width:100%;padding:5px;margin:0px auto;overflow:auto;}
        .jsonRes{margin-left:30px;}
        #send{cursor:pointer;}
        .btn-part{width:325px;}
        textarea, select, .form-control, .custom-select, button.btn, .btn-primary, input[type="text"], input[type="url"], .uneditable-input{
            border: 1px solid #363e75; outline: 0 !important; border-radius:0px; box-shadow: none;
        }
        #loading {
            position: fixed; left: 0px; top: 0px; width: 100%; height: 100%; z-index: 9999999999;
            overflow: hidden; background: rgba(255, 255, 255, 0.7);
        }
        .loader {
            border: 8px solid #f3f3f3; border-top: 8px solid #363e75; border-radius: 50%;
            width: 60px; height: 60px; left: 50%; margin-left: -4em; display: block; animation: spin 2s linear infinite;
        }
        .loader, .loader:after {display: block;position: absolute;top: 50%;margin-top: -4.05em;}
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .right-part{border:1px solid #dedede;padding:5px;}
        .logo{position:absolute;right:0px;bottom:0px;margin-right:30px;margin-bottom:30px;}
        .badge-lg { font-size: 1.1rem; padding: 8px 15px; width: 100%; margin-bottom: 10px; display: block; }
        .raw-values { font-size: 12px; color: #666; margin-top: 15px; border-top: 1px dashed #ccc; padding-top: 10px; }
    </style>
</head>
<body>
    <div class="main container">
        <section class="iupload">
            <h3 class="text-center py-4">Chest Cancer Classification</h3>
            <div class="row">
                <div class="img-part col-md-6">
                    <div class="image-part">
                        <video autoplay id="video" poster="https://img.freepik.com/free-vector/group-young-people-posing-photo_52683-18824.jpg?size=338&ext=jpg"></video>
                        <img src="" id="photo">
                        <canvas style="display:none;" id="canvas"></canvas>
                    </div>
                    <div class="btn-part">
                        <form id="upload-data pt-3" class="">
                            <div class="input-group mt-3 row">
                                <button type="button" class="btn btn-primary col-md-5 col-xs-5 ml-3 mr-4" id="uload">Upload</button>
                                <button id="send" type="button" class="btn btn-success col-md-5 col-xs-5">Predict</button>
                            </div>
                            <input type="hidden" class="form-control mr-2" id="url" placeholder="Enter REST Api url..." value="/predict"/>
                            <input name="upload" type="file" id="fileinput" style="position:absolute;top:-500px;"/><br/>
                        </form>
                    </div>
                </div>
                <div class="col-md-6 col-xs-12 right-part">
                    <h5 class="mb-2"><center>Prediction Results</center></h5>
                    <div class="row">
                        <div class="res-part col-md-12 col-xs-12"></div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <div id="loading"><div class="loader"></div></div>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>

<script>
var base_data = "";

function sendRequest(base64Data){
    if(base64Data != "" || base64Data != null){
        var url = $("#url").val();
        $("#loading").show();
        
        $.ajax({
            url : url,
            type: "post",
            cache: false,
            async: true,
            crossDomain: true,
            headers: {
                'Content-Type': 'application/json',
                'Access-Control-Allow-Origin':'*'
            },
            data:JSON.stringify({image:base64Data}),
            success: function(res){
                $(".res-part").html("");
                $("#loading").hide();

                var probPct = (res.probability * 100).toFixed(2);
                
                // Format Raw Values for Display
                var gateP = res.gate_p.toFixed(5);
                var cancerP = (res.cancer_p !== null) ? res.cancer_p.toFixed(5) : "N/A";

                // CASE 1: Not a CT Scan
                if (res.is_ct === false) {
                    $(".res-part").html(`
                        <div class="text-center pt-5">
                            <h4 class="text-info font-weight-bold">🚫 ${res.label}</h4>
                            <p class="mt-3" style="font-size:16px;">
                                Probability of NOT being a CT: <b style="color:#17a2b8;">${probPct}%</b>
                            </p>
                            <small class="text-muted">Please upload a valid chest CT scan.</small>
                            
                            <div class="raw-values text-left">
                                <strong>Raw Model Outputs:</strong><br>
                                Gate Model (p_non_ct): ${gateP}<br>
                                Cancer Model (p_cancer): Skipped
                            </div>
                        </div>
                    `);
                } 
                // CASE 2: Valid CT Scan
                else {
                    var badgeClass = "badge-success"; 
                    var barClass = "bg-success";
                    
                    if (res.label.includes("Adenocarcinoma")) {
                        badgeClass = "badge-danger";
                        barClass = "bg-danger";
                    }
                    if (res.label.includes("uncertainty")) {
                        badgeClass = "badge-warning";
                        barClass = "bg-warning";
                    }

                    $(".res-part").html(`
                        <div style="padding: 20px;">
                            <h6 class="text-muted text-uppercase mb-3">Diagnosis Report</h6>
                            
                            <span class="badge ${badgeClass} badge-lg">${res.label}</span>
                            
                            <div class="mt-4">
                                <div class="d-flex justify-content-between">
                                    <span class="font-weight-bold">Model Confidence</span>
                                    <span class="font-weight-bold">${probPct}%</span>
                                </div>
                                <div class="progress mt-2" style="height: 20px;">
                                    <div class="progress-bar ${barClass}" role="progressbar" 
                                         style="width: ${probPct}%" aria-valuenow="${probPct}" aria-valuemin="0" aria-valuemax="100">
                                    </div>
                                </div>
                            </div>

                            <hr class="mt-4">
                            <div class="alert alert-light border text-center mb-0">
                                <small>✅ Validated by CT Gate Check</small>
                            </div>

                            <div class="raw-values">
                                <strong>Raw Model Outputs:</strong><br>
                                Gate Model (p_non_ct): ${gateP}<br>
                                Cancer Model (p_cancer): ${cancerP}
                            </div>
                        </div>
                    `);
                }
            },
            error: function(err){
                $("#loading").hide();
                $(".res-part").html("<p class='text-danger text-center pt-5'>Something went wrong. Please try again.</p>");
            }
        });
    }
}

$(document).ready(function(){
    $("#loading").hide();

    $('#send').click(function(evt){
        sendRequest(base_data);
    });

    $('#uload').click(function(evt) {
        $('#fileinput').focus().trigger('click');
    });

    $("#fileinput").change(function(){
        if (this.files && this.files[0]){
            var reader = new FileReader();
            reader.onload = function (e){
                var url = e.target.result;
                var img = new Image();
                img.crossOrigin = 'Anonymous';
                img.onload = function(){
                    var canvas = document.createElement('CANVAS');
                    var ctx = canvas.getContext('2d');
                    canvas.height = this.height;
                    canvas.width = this.width;
                    ctx.drawImage(this, 0, 0);
                    base_data = canvas.toDataURL('image/jpeg', 1.0).replace(/^data:image.+;base64,/, '');
                    canvas = null;
                };
                img.src = url;
                $('#photo').attr('src', url);
                $('#photo').show();
                $('#video').hide();
            }
            reader.readAsDataURL(this.files[0]);
        }
    });
});
</script>
</body>
</html>
